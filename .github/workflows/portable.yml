name: Desktop packages
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libdbus-1-dev libxkbcommon-dev rpm squashfs-tools
      - run: pip install cargo-zigbuild ziglang==0.17.0
      - run: node --test browser-extension/*.test.js
      - run: cargo test --locked --release --workspace
      - run: cargo zigbuild --locked --release --target x86_64-unknown-linux-gnu.2.28
      - name: Package DEB, RPM and AppImage
        run: |
          curl -fL https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 -o /tmp/runtime-x86_64
          python scripts/package_linux.py --binary target/x86_64-unknown-linux-gnu/release/download_craft --runtime /tmp/runtime-x86_64
          python scripts/package_extensions.py --output /tmp/downloadcraft-extensions
          cp /tmp/downloadcraft-extensions/*.zip /tmp/downloadcraft-extensions/*.xpi dist/
          for image in dist/DownloadCraft-*-x86_64.AppImage; do "$image" --appimage-extract-and-run --version; done
      - uses: actions/upload-artifact@v4
        with:
          name: DownloadCraft-Linux
          path: dist/*
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test browser-extension/*.test.js
      - run: cargo test --locked --release --workspace
      - run: cargo build --locked --release --target aarch64-apple-darwin --target x86_64-apple-darwin
      - run: lipo -create target/aarch64-apple-darwin/release/download_craft target/x86_64-apple-darwin/release/download_craft -output /tmp/download_craft
      - run: python scripts/package.py --platform macos --arch Universal --binary /tmp/download_craft
      - uses: actions/upload-artifact@v4
        with:
          name: DownloadCraft-macOS
          path: dist/*.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows resource compiler
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $resource = Get-ChildItem C:\ProgramData\chocolatey\lib\mingw -Filter windres.exe -Recurse | Select-Object -First 1
          if ($resource) { "WINDRES=$($resource.FullName)" >> $env:GITHUB_ENV }
      - run: node --test browser-extension/*.test.js
        shell: bash
      - run: cargo test --locked --release --workspace
      - run: cargo build --locked --release
      - run: python scripts/package.py --platform windows --arch x64
      - name: Windows installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = Get-ChildItem dist -Filter "*-windows-x64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath stage -Force
          $src = (Get-ChildItem stage -Directory | Select-Object -First 1).FullName
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$src" "/O$PWD\dist" installer\downloadcraft.iss
      - uses: actions/upload-artifact@v4
        with:
          name: DownloadCraft-Windows
          path: |
            dist/*.zip
            dist/*-setup.exe
  docker:
    # Server mode's image: built on every push (so a break shows), published
    # to ghcr.io/<owner>/downloadcraft on release tags.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/downloadcraft" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ steps.tags.outputs.image }}:latest
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only the packages: the Docker build's own record is an artifact
          # too, and it is not a zip that unpacks.
          pattern: DownloadCraft-*
          merge-multiple: true
      - name: Publish release and packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          # The app's one-click update looks for the "-portable" Windows zip.
          for f in dist/*-windows-x64.zip; do
            [ -e "$f" ] && mv "$f" "${f%.zip}-portable.zip"
          done
          gh release create "$RELEASE_TAG" dist/* \
            --title "Download Craft $version" \
            --notes-file RELEASE-NOTES.md
